name: Deploy Prod

run-name: "Deploy Prod [${{ inputs.request_id || github.sha }}]"

on:
  push:
    branches:
      - main
    paths:
      - 'tracking-rules/**'
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque id from the MCP; embedded in run-name."
        required: true
        type: string

concurrency:
  group: segment-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 10
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build lib/
        run: npm run build

      - name: Initialize result.json
        run: |
          echo '{"ok":true,"workflow":"deploy-prod.yml","plans":[],"errors":[]}' > "$RUNNER_TEMP/result.json"

      - name: Build plans matrix
        id: plans
        run: |
          MATRIX=$(jq -c '[.plans[] | {name, path, secret: .prod_secret}]' config/tracking-plans-config.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Patch Prod, save snapshot, render docs
        env:
          MATRIX: ${{ steps.plans.outputs.matrix }}
          SEGMENT_API_KEY: ${{ secrets.SEGMENT_PUBLIC_API_TOKEN }}
          PROD_SEGMENT_TRACKING_PLAN_ID_JAVASCRIPT: ${{ secrets.PROD_SEGMENT_TRACKING_PLAN_ID_JAVASCRIPT }}
          PROD_SEGMENT_TRACKING_PLAN_ID_SERVER: ${{ secrets.PROD_SEGMENT_TRACKING_PLAN_ID_SERVER }}
          BASE_REF: HEAD^
        run: |
          set +e
          overall_ok=true
          errors=()
          entries="[]"
          count=$(echo "$MATRIX" | jq 'length')
          for i in $(seq 0 $((count - 1))); do
            name=$(echo "$MATRIX" | jq -r ".[$i].name")
            path=$(echo "$MATRIX" | jq -r ".[$i].path")
            secret=$(echo "$MATRIX" | jq -r ".[$i].secret")
            plan_id="${!secret}"
            echo "::group::Deploy $name ($path) to Prod"

            output=$(SEGMENT_TRACKING_PLAN_ID="$plan_id" PLAN_DIR="tracking-rules/$path" node scripts/update-tracking-plan.js 2>&1)
            status=$?
            echo "$output"
            if [ $status -ne 0 ]; then
              overall_ok=false
              errors+=("$name: patch failed: $(echo "$output" | tail -n 1)")
              entries=$(echo "$entries" | jq --arg plan "$path" '. + [{plan:$plan,env:"prod",rules_patched:0}]')
              echo "::endgroup::"
              continue
            fi
            patched=$(echo "$output" | grep -oE 'Updated [0-9]+ rules' | grep -oE '[0-9]+' | head -n1)
            patched=${patched:-0}

            save_out=$(SEGMENT_TRACKING_PLAN_ID="$plan_id" PLAN_DIR="plans/prod/$path" node scripts/save-tracking-plan.js 2>&1)
            save_status=$?
            echo "$save_out"
            if [ $save_status -ne 0 ]; then
              overall_ok=false
              errors+=("$name: save failed: $(echo "$save_out" | tail -n 1)")
            fi

            render_out=$(node scripts/render-tp.js "$name Tracking Plan" "plans/prod/$path/current-rules.json" "docs/${path}_tracking_plan.md" 2>&1)
            render_status=$?
            echo "$render_out"
            if [ $render_status -ne 0 ]; then
              overall_ok=false
              errors+=("$name: render failed: $(echo "$render_out" | tail -n 1)")
            fi

            entries=$(echo "$entries" | jq --arg plan "$path" --argjson n "$patched" '. + [{plan:$plan,env:"prod",rules_patched:$n}]')
            echo "::endgroup::"
          done
          jq --argjson ok "$overall_ok" --argjson plans "$entries" \
            '.ok = $ok | .plans = $plans' \
            "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/result.next.json"
          mv "$RUNNER_TEMP/result.next.json" "$RUNNER_TEMP/result.json"
          if [ ${#errors[@]} -gt 0 ]; then
            printf '%s\n' "${errors[@]}" > "$RUNNER_TEMP/errors.txt"
            jq --rawfile e "$RUNNER_TEMP/errors.txt" '.errors = ($e | split("\n") | map(select(length > 0)))' \
              "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/result.next.json"
            mv "$RUNNER_TEMP/result.next.json" "$RUNNER_TEMP/result.json"
          fi
          cat "$RUNNER_TEMP/result.json"
          if [ "$overall_ok" != "true" ]; then
            exit 1
          fi

      - name: Commit snapshot and docs
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add plans/prod docs || true
          if git diff --cached --quiet; then
            echo "No prod snapshot or docs changes to commit."
            exit 0
          fi
          git commit -m "chore(prod): sync snapshot and docs [skip ci]"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: result
          path: ${{ runner.temp }}/result.json
          if-no-files-found: warn
