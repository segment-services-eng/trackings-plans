name: Generate Markdown

run-name: "Generate Markdown [${{ inputs.request_id }}]"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque id from the caller; embedded in run-name."
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-markdown:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Build lib/
      run: npm run build
    - name: Configure Git identity
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: Fetch main branch
      run: git fetch origin main:main

    - name: Switch to main branch
      run: git checkout main

    - name: Generate markdown
      run: |
        node scripts/render-tp.js "JavaScript Tracking Plan" "plans/prod/javascript/current-rules.json" "docs/javascript_tracking_plan.md"
        node scripts/render-tp.js "Server Tracking Plan" "plans/prod/server/current-rules.json" "docs/server_tracking_plan.md"

    - name: Commit and push changes
      run: |
        git add docs/javascript_tracking_plan.md docs/server_tracking_plan.md
        git commit -m "Regenerate tracking plan markdown [skip ci]" || echo "No changes to commit"
        git push origin main
