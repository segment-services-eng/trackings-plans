name: Reset Dev

run-name: "Reset Dev [${{ inputs.request_id }}]"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque id from the MCP; embedded in run-name."
        required: true
        type: string
      plan:
        description: "Plan path (e.g. javascript) or 'all'."
        required: true
        type: string

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build lib/
        run: npm run build

      - name: Initialize result.json
        run: |
          echo '{"ok":true,"workflow":"reset-dev.yml","plans":[],"errors":[]}' > "$RUNNER_TEMP/result.json"

      - name: Build plans matrix
        id: plans
        env:
          TARGET_PLAN: ${{ inputs.plan }}
        run: |
          if [ "$TARGET_PLAN" = "all" ]; then
            MATRIX=$(jq -c '[.plans[] | {name, path, secret: .dev_secret}]' config/tracking-plans-config.json)
          else
            MATRIX=$(jq -c --arg p "$TARGET_PLAN" '[.plans[] | select(.path == $p) | {name, path, secret: .dev_secret}]' config/tracking-plans-config.json)
          fi
          if [ "$(echo "$MATRIX" | jq 'length')" = "0" ]; then
            echo "No plans matched TARGET_PLAN=$TARGET_PLAN"
            exit 1
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Reset Dev from prod snapshot
        env:
          MATRIX: ${{ steps.plans.outputs.matrix }}
          SEGMENT_API_KEY: ${{ secrets.SEGMENT_PUBLIC_API_TOKEN }}
          DEV_SEGMENT_TRACKING_PLAN_ID_JAVASCRIPT: ${{ secrets.DEV_SEGMENT_TRACKING_PLAN_ID_JAVASCRIPT }}
          DEV_SEGMENT_TRACKING_PLAN_ID_SERVER: ${{ secrets.DEV_SEGMENT_TRACKING_PLAN_ID_SERVER }}
        run: |
          set +e
          overall_ok=true
          errors=()
          entries="[]"
          count=$(echo "$MATRIX" | jq 'length')
          for i in $(seq 0 $((count - 1))); do
            name=$(echo "$MATRIX" | jq -r ".[$i].name")
            path=$(echo "$MATRIX" | jq -r ".[$i].path")
            secret=$(echo "$MATRIX" | jq -r ".[$i].secret")
            plan_id="${!secret}"
            snapshot="plans/prod/$path/current-rules.json"
            if [ ! -f "$snapshot" ]; then
              overall_ok=false
              errors+=("$name: missing prod snapshot $snapshot")
              entries=$(echo "$entries" | jq --arg plan "$path" '. + [{plan:$plan,env:"dev",rules_patched:0,rules_deleted:0}]')
              continue
            fi
            echo "::group::Reset Dev for $name ($path)"
            output=$(SEGMENT_TRACKING_PLAN_ID="$plan_id" PLAN_DIR="plans/prod/$path" node scripts/reset-tracking-plan.js 2>&1)
            status=$?
            echo "$output"
            echo "::endgroup::"
            if [ $status -ne 0 ]; then
              overall_ok=false
              errors+=("$name: reset failed: $(echo "$output" | tail -n 1)")
            fi
            entries=$(echo "$entries" | jq --arg plan "$path" '. + [{plan:$plan,env:"dev",rules_patched:0,rules_deleted:0}]')
          done
          jq --argjson ok "$overall_ok" --argjson plans "$entries" \
            '.ok = $ok | .plans = $plans' \
            "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/result.next.json"
          mv "$RUNNER_TEMP/result.next.json" "$RUNNER_TEMP/result.json"
          if [ ${#errors[@]} -gt 0 ]; then
            printf '%s\n' "${errors[@]}" > "$RUNNER_TEMP/errors.txt"
            jq --rawfile e "$RUNNER_TEMP/errors.txt" '.errors = ($e | split("\n") | map(select(length > 0)))' \
              "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/result.next.json"
            mv "$RUNNER_TEMP/result.next.json" "$RUNNER_TEMP/result.json"
          fi
          cat "$RUNNER_TEMP/result.json"
          if [ "$overall_ok" != "true" ]; then
            exit 1
          fi

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: ${{ runner.temp }}/result.json
          if-no-files-found: warn
